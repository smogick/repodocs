<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>repodocs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
<script>
  try {
    var t = localStorage.getItem('repodocs-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="row1">
        <h1>repodocs</h1>
        <div class="header-actions">
          <button id="new-card-btn" class="icon-btn" title="Новая карточка"></button>
          <button id="trash-toggle" class="icon-btn" title="Корзина"></button>
          <button id="theme-toggle" class="icon-btn" title="Переключить тему"></button>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon"></span>
        <input id="search" type="text" placeholder="Поиск по названию, summary, тегам..." />
      </div>
      <div id="filters"></div>
    </div>
    <div id="card-list"></div>
  </div>
  <div id="file-tree-panel">
    <div id="file-tree-toolbar">
      <button id="new-file-btn" class="icon-btn" title="Новый файл (можно с подпапкой, напр. module/overview.md)"></button>
      <button id="new-folder-btn" class="icon-btn" title="Новая папка"></button>
    </div>
    <div id="file-tree"></div>
  </div>
  <div id="main">
    <div id="main-header"><div id="empty-header"></div></div>
    <div id="frontmatter-bar"></div>
    <div id="editor-area">
      <div id="editor-toolbar" style="display:none">
        <button id="save-btn" class="primary"></button>
        <button id="reindex-btn"></button>
        <div id="pane-mode-switch" class="segmented"></div>
        <button id="delete-btn" class="danger"></button>
        <span id="save-status"></span>
      </div>
      <div id="content-panes">
        <div id="raw-pane"><div id="empty-state">Выбери карточку слева</div></div>
        <div id="preview-pane"></div>
      </div>
    </div>
  </div>
</div>
<dialog id="new-card-dialog">
  <form id="new-card-form" method="dialog">
    <h2>Новая карточка</h2>
    <label>Раздел
      <select name="root">
        <option value="projects">Проекты</option>
        <option value="areas">Области</option>
        <option value="resources">Ресурсы</option>
      </select>
    </label>
    <label>Название
      <input name="title" type="text" required autocomplete="off" placeholder="Например: Guardium" />
    </label>
    <label>Slug (имя папки)
      <input name="slug" type="text" required autocomplete="off" pattern="[a-z0-9][a-z0-9._\-]*" placeholder="guardium" />
    </label>
    <label>Summary
      <input name="summary" type="text" autocomplete="off" placeholder="Одна строка о сути" />
    </label>
    <p class="dialog-hint">README.md создаётся из шаблона в <code>templates/</code>; статус, стек и теги правятся потом через панель метаданных.</p>
    <div class="dialog-actions">
      <button type="button" id="new-card-cancel">Отмена</button>
      <button type="submit" class="primary">Создать</button>
    </div>
  </form>
</dialog>
<script src="vendor/icons.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="app.js"></script>
</body>
</html>
